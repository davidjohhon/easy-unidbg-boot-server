<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="#{oplogs.title}">Operation Logs - Admin</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/bootstrap-icons.css">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
    <div class="page-wrap">
        <div th:replace="admin/fragments::sidebar ('oplogs')"></div>
        <div class="content p-4 w-100">
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2 class="mb-0" th:text="#{oplogs.title}">Operation Logs</h2>
                <form th:action="@{/admin/oplogs/clear}" method="post" onsubmit="return confirm('Clear all operation logs?')">
                    <button class="btn btn-outline-danger"><i class="bi bi-trash"></i> <span th:text="#{oplogs.clearAll}">Clear All</span></button>
                </form>
            </div>
            <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <table class="table table-striped mb-0">
                        <thead class="table-dark">
                            <tr>
                                <th>ID</th>
                                <th th:text="#{oplogs.operator}">Operator</th>
                                <th th:text="#{oplogs.action}">Action</th>
                                <th th:text="#{oplogs.target}">Target</th>
                                <th th:text="#{oplogs.detail}">Detail</th>
                                <th th:text="#{oplogs.time}">Time</th>
                                <th th:text="#{oplogs.actions}">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="op : ${oplogs}">
                                <td th:text="${op.id}"></td>
                                <td th:text="${op.operator}"></td>
                                <td><code th:text="${op.action}"></code></td>
                                <td><code class="small" th:text="${op.target}"></code></td>
                                <td><span class="small text-muted" th:text="${op.detail}"></span></td>
                                <td th:text="${#temporals.format(op.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
                                <td>
                                    <form th:action="@{/admin/oplogs/delete/{id}(id=${op.id})}" method="post" style="display:inline" onsubmit="return confirm('Delete this log?')">
                                        <button class="btn btn-sm btn-outline-danger" title="Delete"><i class="bi bi-trash"></i></button>
                                    </form>
                                </td>
                            </tr>
                            <tr th:if="${#lists.isEmpty(oplogs)}">
                                <td colspan="7" class="text-center text-muted py-4"><span th:text="#{oplogs.noLogs}">No operation logs yet</span></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <nav class="mt-3" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/oplogs(page=${currentPage - 1})}">Previous</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}" th:classappend="${i == currentPage} ? 'active'">
                        <a class="page-link" th:href="@{/admin/oplogs(page=${i})}" th:text="${i + 1}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage >= totalPages - 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/oplogs(page=${currentPage + 1})}">Next</a>
                    </li>
                </ul>
            </nav>
            <p class="text-muted text-center small" th:if="${totalPages > 0}" th:text="'Total: ' + ${totalElements} + ' records'"></p>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
    <div th:replace="admin/fragments::footer"></div>
</html>
