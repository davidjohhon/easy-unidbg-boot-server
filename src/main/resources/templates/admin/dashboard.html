<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - Admin</title>
    <link href="/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/bootstrap-icons.css">
    <link th:href="@{/css/admin.css}" rel="stylesheet">
</head>
<body>
    <div class="page-wrap">
        <div th:replace="admin/fragments::sidebar ('dashboard')"></div>
        <div class="content p-4 w-100">
            <h2 class="mb-4">Dashboard</h2>
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card border-primary">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted">Modules</h6>
                                    <h2 class="mb-0" th:text="${moduleCount}">0</h2>
                                </div>
                                <i class="bi bi-box-seam fs-1 text-primary opacity-50"></i>
                            </div>
                            <a th:href="@{/admin/modules}" class="stretched-link"></a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card border-success">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted">Total Requests</h6>
                                    <h2 class="mb-0" th:text="${logCount}">0</h2>
                                </div>
                                <i class="bi bi-bar-chart-line fs-1 text-success opacity-50"></i>
                            </div>
                            <a th:href="@{/admin/logs}" class="stretched-link"></a>
                        </div>
                    </div>
                </div>
                <div class="col-md-4 mb-4">
                    <div class="card border-info">
                        <div class="card-body">
                            <div class="d-flex justify-content-between align-items-center">
                                <div>
                                    <h6 class="text-muted">Server</h6>
                                    <p class="mb-0 small">easy-unidbg-boot-server</p>
                                </div>
                                <i class="bi bi-server fs-1 text-info opacity-50"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="/js/bootstrap.bundle.min.js"></script>
</body>
    <div th:replace="admin/fragments::footer"></div>
</html>
