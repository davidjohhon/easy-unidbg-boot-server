<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
    <div th:fragment="langbar" class="langbar">
        <a th:href="@{/admin/dashboard(lang=en)}" class="btn btn-sm" th:classappend="${session.LANG == null || session.LANG == 'en'} ? 'active' : ''">EN</a>
        <a th:href="@{/admin/dashboard(lang=zh)}" class="btn btn-sm" th:classappend="${session.LANG == 'zh'} ? 'active' : ''">中文</a>
    </div>
    <div th:fragment="sidebar (activePage)" class="sidebar d-flex flex-column p-3 text-white bg-dark" style="width: 240px; height: 100vh; position: fixed; top: 0; left: 0;">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <a th:href="@{/admin/dashboard}" class="text-white text-decoration-none">
                <span class="fs-6 fw-bold" style="letter-spacing:-0.2px">Easy Unidbg</span>
            </a>
            <div class="btn-group btn-group-sm">
                <a th:href="@{/admin/dashboard(lang=en)}" class="btn btn-sm btn-outline-light" th:classappend="${session.LANG == null || session.LANG == 'en'} ? 'active' : ''" style="font-size:.7rem;padding:.1rem .35rem;">EN</a>
                <a th:href="@{/admin/dashboard(lang=zh)}" class="btn btn-sm btn-outline-light" th:classappend="${session.LANG == 'zh'} ? 'active' : ''" style="font-size:.7rem;padding:.1rem .35rem;">中文</a>
            </div>
        </div>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li class="nav-item">
                <a th:href="@{/admin/dashboard}" class="nav-link text-white" th:classappend="${activePage == 'dashboard'} ? 'active' : 'text-white'">
                    <i class="bi bi-speedometer2 me-2"></i> <span th:text="#{sidebar.dashboard}">Dashboard</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/modules}" class="nav-link text-white" th:classappend="${activePage == 'modules'} ? 'active' : 'text-white'">
                    <i class="bi bi-box-seam me-2"></i> <span th:text="#{sidebar.services}">Services</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/oplogs}" class="nav-link text-white" th:classappend="${activePage == 'oplogs'} ? 'active' : 'text-white'">
                    <i class="bi bi-clipboard-data me-2"></i> <span th:text="#{sidebar.operationLogs}">Operation Logs</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/logs}" class="nav-link text-white" th:classappend="${activePage == 'logs'} ? 'active' : 'text-white'">
                    <i class="bi bi-journal-text me-2"></i> <span th:text="#{sidebar.accessLogs}">Access Logs</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/apikeys}" class="nav-link text-white" th:classappend="${activePage == 'apikeys'} ? 'active' : 'text-white'">
                    <i class="bi bi-key me-2"></i> <span th:text="#{sidebar.apikeys}">API Keys</span>
                </a>
            </li>
        </ul>
        <hr>
        <ul class="nav nav-pills flex-column mb-auto">
            <li>
                <a th:href="@{/admin/profile}" class="nav-link text-white" th:classappend="${activePage == 'profile'} ? 'active' : 'text-white'">
                    <i class="bi bi-person-circle me-2"></i> <span th:text="#{sidebar.profile}">Profile</span>
                </a>
            </li>
            <li>
                <a th:href="@{/admin/users}" class="nav-link text-white" th:classappend="${activePage == 'users'} ? 'active' : 'text-white'">
                    <i class="bi bi-people me-2"></i> <span th:text="#{sidebar.users}">Users</span>
                </a>
            </li>
            <li class="mt-2">
                <a class="nav-link text-white" th:href="@{/admin/logout}">
                    <i class="bi bi-box-arrow-right me-2"></i> <span th:text="#{sidebar.signOut}">Sign out</span>
                </a>
            </li>
        </ul>
    </div>
    <div th:fragment="footer" class="text-center text-muted small py-3" style="margin-left:240px;clear:both;">
        v<span th:text="${appVersion}">1.0.0</span>
    </div>
</body>
</html>
